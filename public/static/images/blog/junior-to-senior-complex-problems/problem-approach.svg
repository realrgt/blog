<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="58" font-size="28" font-weight="700" fill="#0f172a">Two ways to attack the same problem</text>

    <text x="60" y="118" font-size="18" font-weight="700" fill="#64748b">CODING FAST</text>
    <g font-size="17" text-anchor="middle">
      <rect x="60" y="136" width="200" height="70" rx="10" fill="#e2e8f0"/><text x="160" y="177" fill="#0f172a">Read the ticket</text>
      <rect x="320" y="136" width="200" height="70" rx="10" fill="#e2e8f0"/><text x="420" y="177" fill="#0f172a">Write the code</text>
      <rect x="580" y="136" width="200" height="70" rx="10" fill="#e2e8f0"/><text x="680" y="177" fill="#0f172a">Ship</text>
      <rect x="840" y="136" width="300" height="70" rx="10" fill="#fee2e2" stroke="#ef4444"/><text x="990" y="177" fill="#991b1b">Discover the problem in prod</text>
    </g>
    <g stroke="#475569" stroke-width="3" fill="none">
      <line x1="262" y1="171" x2="316" y2="171" marker-end="url(#a)"/>
      <line x1="522" y1="171" x2="576" y2="171" marker-end="url(#a)"/>
      <line x1="782" y1="171" x2="836" y2="171" marker-end="url(#a)"/>
      <path d="M 990 208 L 990 236 L 420 236 L 420 210" marker-end="url(#a)"/>
    </g>
    <text x="705" y="258" text-anchor="middle" font-size="15" fill="#64748b">hotfix, patch, repeat</text>

    <text x="60" y="318" font-size="18" font-weight="700" fill="#15803d">DESIGNING SYSTEMS</text>
    <g font-size="16" text-anchor="middle">
      <rect x="60" y="336" width="170" height="80" rx="10" fill="#16a34a"/>
      <text x="145" y="370" fill="#ffffff" font-weight="600">Understand</text><text x="145" y="394" fill="#dcfce7">the real problem</text>
      <rect x="250" y="336" width="170" height="80" rx="10" fill="#16a34a"/>
      <text x="335" y="370" fill="#ffffff" font-weight="600">Map</text><text x="335" y="394" fill="#dcfce7">constraints</text>
      <rect x="440" y="336" width="170" height="80" rx="10" fill="#16a34a"/>
      <text x="525" y="370" fill="#ffffff" font-weight="600">Compare</text><text x="525" y="394" fill="#dcfce7">options</text>
      <rect x="630" y="336" width="170" height="80" rx="10" fill="#16a34a"/>
      <text x="715" y="370" fill="#ffffff" font-weight="600">Decide</text><text x="715" y="394" fill="#dcfce7">and write it down</text>
      <rect x="820" y="336" width="150" height="80" rx="10" fill="#16a34a"/>
      <text x="895" y="370" fill="#ffffff" font-weight="600">Ship small</text><text x="895" y="394" fill="#dcfce7">increments</text>
      <rect x="990" y="336" width="150" height="80" rx="10" fill="#16a34a"/>
      <text x="1065" y="370" fill="#ffffff" font-weight="600">Observe</text><text x="1065" y="394" fill="#dcfce7">and learn</text>
    </g>
    <g stroke="#16a34a" stroke-width="3" fill="none">
      <line x1="231" y1="376" x2="247" y2="376" marker-end="url(#g)"/>
      <line x1="421" y1="376" x2="437" y2="376" marker-end="url(#g)"/>
      <line x1="611" y1="376" x2="627" y2="376" marker-end="url(#g)"/>
      <line x1="801" y1="376" x2="817" y2="376" marker-end="url(#g)"/>
      <line x1="971" y1="376" x2="987" y2="376" marker-end="url(#g)"/>
      <path d="M 1065 418 L 1065 460 L 145 460 L 145 420" marker-end="url(#g)"/>
    </g>
    <text x="605" y="488" text-anchor="middle" font-size="15" fill="#15803d">what production teaches feeds the next decision</text>
    <text x="60" y="530" font-size="15" fill="#64748b">The first path is faster on day one. The second is faster by month three.</text>
  </g>
</svg>
