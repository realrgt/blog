<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="26" letter-spacing="4" fill="#22c55e" font-weight="600">REFINEMENT · DISCOVERY</text>
    <text x="80" y="250" font-size="76" font-weight="700" fill="#f8fafc">Ask Before</text>
    <text x="80" y="340" font-size="76" font-weight="700" fill="#f8fafc">You Code</text>
    <text x="80" y="410" font-size="30" fill="#94a3b8">The questions that prevent rework</text>

    <g transform="translate(760 150)">
      <rect x="0" y="0" width="320" height="330" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="24" y="26" width="120" height="16" rx="8" fill="#16a34a"/>
      <rect x="24" y="62" width="250" height="12" rx="6" fill="#475569"/>
      <rect x="24" y="86" width="200" height="12" rx="6" fill="#475569"/>
      <g font-size="22" fill="#e2e8f0">
        <circle cx="38" cy="140" r="14" fill="#16a34a"/><text x="38" y="148" text-anchor="middle" font-weight="700" fill="#ffffff">?</text>
        <text x="64" y="148">What if it fails?</text>
        <circle cx="38" cy="190" r="14" fill="#16a34a"/><text x="38" y="198" text-anchor="middle" font-weight="700" fill="#ffffff">?</text>
        <text x="64" y="198">Who else uses it?</text>
        <circle cx="38" cy="240" r="14" fill="#16a34a"/><text x="38" y="248" text-anchor="middle" font-weight="700" fill="#ffffff">?</text>
        <text x="64" y="248">How much volume?</text>
        <circle cx="38" cy="290" r="14" fill="#16a34a"/><text x="38" y="298" text-anchor="middle" font-weight="700" fill="#ffffff">?</text>
        <text x="64" y="298">What is out of scope?</text>
      </g>
    </g>
  </g>
</svg>
