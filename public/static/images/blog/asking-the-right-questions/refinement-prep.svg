<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="58" font-size="28" font-weight="700" fill="#0f172a">Before, during and after the refinement</text>
    <text x="60" y="92" font-size="18" fill="#475569">Most of the value is created the day before the call, and kept the day after.</text>

    <g font-size="17">
      <rect x="60" y="130" width="340" height="300" rx="14" fill="#16a34a"/>
      <text x="230" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">The day before</text>
      <g fill="#dcfce7">
        <text x="88" y="214">• Read the agenda and the cards</text>
        <text x="88" y="246">• Revisit the current flows</text>
        <text x="88" y="278">• Assume every card is yours</text>
        <text x="88" y="310">• Size it: complexity, dependencies</text>
        <text x="88" y="342">• List the risks</text>
        <text x="88" y="374">• Write your questions down</text>
      </g>

      <rect x="430" y="130" width="340" height="300" rx="14" fill="#0ea5e9"/>
      <text x="600" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">In the call</text>
      <g fill="#e0f2fe">
        <text x="458" y="214">• Ask everything, assume nothing</text>
        <text x="458" y="246">• Turn rules into examples</text>
        <text x="458" y="278">• Confirm what is out of scope</text>
        <text x="458" y="310">• Name the owner of each answer</text>
        <text x="458" y="342">• Park what nobody knows yet</text>
        <text x="458" y="374">• Agree on acceptance criteria</text>
      </g>

      <rect x="800" y="130" width="340" height="300" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
      <text x="970" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The day after</text>
      <g fill="#334155">
        <text x="828" y="214">• Write answers into the card</text>
        <text x="828" y="246">• Update acceptance criteria</text>
        <text x="828" y="278">• Follow up on open questions</text>
        <text x="828" y="310">• Flag new risks early</text>
        <text x="828" y="342">• Split cards that grew</text>
        <text x="828" y="374">• Only then: write code</text>
      </g>
    </g>

    <g stroke="#475569" stroke-width="3" fill="none">
      <line x1="402" y1="280" x2="426" y2="280" marker-end="url(#a)"/>
      <line x1="772" y1="280" x2="796" y2="280" marker-end="url(#a)"/>
    </g>
  </g>
</svg>
