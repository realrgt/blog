<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="130" font-size="26" letter-spacing="4" fill="#22c55e" font-weight="600">AI · PLATFORM ENGINEERING</text>
    <text x="80" y="225" font-size="76" font-weight="700" fill="#f8fafc">F1 Engine,</text>
    <text x="80" y="315" font-size="76" font-weight="700" fill="#f8fafc">Traffic Jam</text>
    <text x="80" y="380" font-size="30" fill="#94a3b8">AI won't speed up your company until you fix the road</text>

    <!-- road -->
    <rect x="0" y="450" width="1200" height="130" fill="#1e293b"/>
    <g stroke="#475569" stroke-width="4" stroke-dasharray="36 28">
      <line x1="0" y1="515" x2="1200" y2="515"/>
    </g>

    <!-- race car stuck at the back of the queue -->
    <g transform="translate(90 470)">
      <rect x="0" y="22" width="16" height="30" rx="3" fill="#22c55e"/>
      <rect x="12" y="30" width="150" height="16" rx="8" fill="#16a34a"/>
      <path d="M50 30 L100 30 L112 12 L66 12 Z" fill="#22c55e"/>
      <rect x="152" y="24" width="16" height="28" rx="3" fill="#22c55e"/>
      <circle cx="40" cy="52" r="15" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="132" cy="52" r="15" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
    </g>

    <!-- queue of ordinary cars -->
    <g fill="#475569">
      <rect x="300" y="478" width="110" height="50" rx="12"/>
      <rect x="430" y="478" width="110" height="50" rx="12"/>
      <rect x="560" y="478" width="110" height="50" rx="12"/>
      <rect x="690" y="478" width="110" height="50" rx="12"/>
      <rect x="820" y="478" width="110" height="50" rx="12"/>
    </g>
    <g fill="#0f172a">
      <rect x="318" y="486" width="74" height="18" rx="5"/>
      <rect x="448" y="486" width="74" height="18" rx="5"/>
      <rect x="578" y="486" width="74" height="18" rx="5"/>
      <rect x="708" y="486" width="74" height="18" rx="5"/>
      <rect x="838" y="486" width="74" height="18" rx="5"/>
    </g>

    <!-- toll barrier -->
    <rect x="1000" y="420" width="130" height="120" rx="8" fill="#334155"/>
    <text x="1065" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">APPROVAL</text>
    <text x="1065" y="500" text-anchor="middle" font-size="18" fill="#cbd5e1">ticket #4821</text>
    <rect x="950" y="510" width="60" height="10" rx="3" fill="#ef4444"/>
  </g>
</svg>
