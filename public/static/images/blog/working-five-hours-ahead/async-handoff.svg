<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="58" font-size="28" font-weight="700" fill="#0f172a">The async handoff loop</text>
    <text x="60" y="92" font-size="18" fill="#475569">Write it down before the overlap, so the overlap is spent deciding, not catching up.</text>

    <g font-size="17">
      <rect x="60" y="140" width="240" height="150" rx="12" fill="#16a34a"/>
      <text x="180" y="180" text-anchor="middle" font-weight="700" fill="#ffffff">1. Deep work</text>
      <text x="180" y="212" text-anchor="middle" fill="#dcfce7">Maputo morning</text>
      <text x="180" y="240" text-anchor="middle" fill="#dcfce7">build, investigate,</text>
      <text x="180" y="264" text-anchor="middle" fill="#dcfce7">draft decisions</text>

      <rect x="340" y="140" width="240" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
      <text x="460" y="180" text-anchor="middle" font-weight="700" fill="#0f172a">2. Written update</text>
      <text x="460" y="212" text-anchor="middle" fill="#334155">context + progress</text>
      <text x="460" y="240" text-anchor="middle" fill="#334155">decision needed</text>
      <text x="460" y="264" text-anchor="middle" fill="#334155">blockers + default</text>

      <rect x="620" y="140" width="240" height="150" rx="12" fill="#0ea5e9"/>
      <text x="740" y="180" text-anchor="middle" font-weight="700" fill="#ffffff">3. Team reads</text>
      <text x="740" y="212" text-anchor="middle" fill="#e0f2fe">Brazil morning</text>
      <text x="740" y="240" text-anchor="middle" fill="#e0f2fe">answers, approves,</text>
      <text x="740" y="264" text-anchor="middle" fill="#e0f2fe">flags concerns</text>

      <rect x="900" y="140" width="240" height="150" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
      <text x="1020" y="180" text-anchor="middle" font-weight="700" fill="#0f172a">4. Short sync</text>
      <text x="1020" y="212" text-anchor="middle" fill="#334155">only what async</text>
      <text x="1020" y="240" text-anchor="middle" fill="#334155">could not settle</text>
      <text x="1020" y="264" text-anchor="middle" fill="#334155">in the overlap</text>
    </g>

    <g stroke="#475569" stroke-width="3" fill="none">
      <line x1="302" y1="215" x2="336" y2="215" marker-end="url(#arrow)"/>
      <line x1="582" y1="215" x2="616" y2="215" marker-end="url(#arrow)"/>
      <line x1="862" y1="215" x2="896" y2="215" marker-end="url(#arrow)"/>
      <path d="M 1020 292 L 1020 350 L 180 350 L 180 294" marker-end="url(#arrow)"/>
    </g>
    <text x="600" y="380" text-anchor="middle" font-size="16" fill="#475569">Outcome feeds the next morning's deep work</text>
  </g>
</svg>
